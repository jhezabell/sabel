<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Crumbs Pastry Shop - ContactUs</title>
</head>
<body style="background-color: #c5f0e9; margin: 0; padding: 0; font-family: sans-serif;">

    <a id="top"></a>

    
    <div style="width: 100%; margin: 0; padding: 0;">
        <img src="bgimage.jpg" alt="Banner Image" style="width: 100%; height: 450px; object-fit: cover; display: block;">
    </div>

   
    <header style="position: sticky; top: 0; background: #fea5ee; text-align: center; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <nav style="padding: 10px 0;">
        <a href="Home.html"><button style="font-size: 20px; color: navy; margin: 5px; padding: 8px 0; width: 150px; cursor: pointer;">Home</button></a>
        <a href="AboutUs.html"><button style="font-size: 20px; color: navy; margin: 5px; padding: 8px 0; width: 150px; cursor: pointer;">About Us</button></a>
        <a href="Products.html"><button style="font-size: 20px; color: navy; margin: 5px; padding: 8px 0; width: 150px; cursor: pointer;">Products</button></a>
        <a href="Services.html"><button style="font-size: 20px; color: navy; margin: 5px; padding: 8px 0; width: 150px; cursor: pointer;">Services</button></a>
        <a href="ContactUs.html"><button style="font-size: 20px; color: navy; margin: 5px; padding: 8px 0; width: 150px; cursor: pointer;">Contact Us</button></a>
    </nav>
</header>


    <main style="max-width: 800px; margin: 0 auto; padding: 30px 20px; text-align: center;">

        <section style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 30px;">
            <div style="flex: 1; min-width: 250px; max-width: 350px;">
                <img src="cakehome.jpg" alt="Cake" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            </div>
            
            <div style="flex: 1; min-width: 250px; max-width: 350px;">
                <img src="cupcakehome.jpg" alt="Cupcake" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            </div>
        </section>
    </main>  

    <section style="padding: 0 20px; text-align: left; margin: 20px 0 40px 0;">
        <h1 style="color: navy; margin: 0 0 20px 0; font-size: 2.2rem; font-weight: bold;">Get In Touch:</h1>
        
        <div style="line-height: 2; font-size: 1.2rem; color: #333;">
            <p style="margin: 8px 0;">📍 <strong>Location:</strong> Miagao, PH</p>
            <p style="margin: 8px 0;">📞 <strong>Phone:</strong> <span style="color: #d81b60;">0999-1925</span></p>
            <p style="margin: 8px 0;">📧 <strong>Email:</strong> sweetcrumbs@email.com</p>
            <p style="margin: 8px 0;">🕒 <strong>Hours:</strong> Mon-Sat <span style="color: #d81b60;">8AM-7PM</span></p>
        </div>
    </section>

   
    <section style="max-width: 600px; margin: 0 auto 40px auto; padding: 0 20px;">
        <div style="border: 2px solid #555; border-radius: 8px; padding: 25px; background-color: rgba(255, 255, 255, 0.2);">
            <form action="#" method="post" style="display: flex; flex-direction: column; gap: 20px;">
                
                <div style="display: flex; align-items: center; gap: 10px; text-align: left;">
                    <label for="name" style="font-size: 1.1rem; font-weight: bold; color: #333; min-width: 140px;">Name:</label>
                    <input type="text" id="name" name="name" required style="flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #777; border-radius: 4px;">
                </div>

                <div style="display: flex; align-items: flex-start; gap: 10px; text-align: left;">
                    <label for="message" style="font-size: 1.1rem; font-weight: bold; color: #333; min-width: 140px;">Order/Message:</label>
                    <textarea id="message" name="message" rows="4" required style="flex: 1; padding: 8px 12px; font-size: 1rem; border: 1px solid #777; border-radius: 4px; resize: vertical;"></textarea>
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <button type="submit" style="background-color: navy; color: white; font-size: 1.1rem; font-weight: bold; padding: 10px 25px; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                        Send Inquiry
                    </button>
                </div>

            </form>
        </div>
    </section>

  <footer style="line-height: 1.6; padding: 20px 0; color: black; text-align: center; font-size: 1.1rem; background-color: #fea5ee;">
        <hr style="border: none; background-color: white; height: 3px; margin-bottom: 15px;" />
        
        <ul style="list-style-type: none; padding: 0; margin: 10px 0; color: black;">
            <li>&copy; Copyrighted Sweet Crumbs Pastry Shop</li>
            <li>A.Y. 2026-2027</li>
            <li>Ma. Jhezabel Lego</li>
            <li>All Rights Reserved</li>
        </ul>
    </footer>


</body>
</html>
